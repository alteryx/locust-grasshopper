name: quality checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff-lint:
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out source repository
        uses: actions/checkout@v7
      - name: Set up Python environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
  unit-test:
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    needs: [ruff-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source repository
        uses: actions/checkout@v7
      - name: Set up supported Python versions
        uses: actions/setup-python@v7
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14
            3.15
      - run: pip install "tox==4.67.1"
      - name: Run unit tests
        run: tox run --skip-missing-interpreters false
      - name: Test quickstart with a local API
        run: tox run -e py311-locustmin -- -c example/pytest.ini tests/integration/test_quickstart.py

